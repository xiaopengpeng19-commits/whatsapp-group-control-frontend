version: '3.8'

services:
  frontend:
    build: .
    container_name: whatsapp-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8090/api
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    external: true